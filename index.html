<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="小林要自律喜欢的音乐 · 431 首歌的私人歌单，按风格收好。">
  <meta name="theme-color" content="#07070b">
  <meta property="og:title" content="小林要自律喜欢的音乐 · 私人歌单">
  <meta property="og:description" content="431 首循环播放的私藏，按风格收好。">
  <meta property="og:type" content="website">
  <title>小林要自律喜欢的音乐 · 私人歌单</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <span class="orb orb--violet"></span>
    <span class="orb orb--cyan"></span>
    <span class="orb orb--pink"></span>
    <span class="grain"></span>
  </div>

  <header class="hero">
    <div class="hero__inner">
      <div class="hero__copy">
        <p class="eyebrow"><span class="eyebrow__dot"></span> PRIVATE PLAYLIST · 2026</p>
        <h1 class="hero__title">
          小林要自律
          <span class="hero__title-accent">喜欢的音乐</span>
        </h1>
        <p class="hero__lede">
          <span id="hero-count">431</span> 首循环播放的私藏，按风格收好。<br>
          戴上耳机，慢慢翻。
        </p>

        <div class="hero__actions">
          <button class="btn btn--primary" id="shuffle" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
            随机一首
          </button>
          <button class="btn btn--ghost" id="theme-toggle" type="button" aria-label="切换到浅色主题">
            <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <span class="theme-label">浅色</span>
          </button>
        </div>

        <dl class="stats" aria-label="歌单统计">
          <div class="stat">
            <dt>曲目</dt>
            <dd data-count="431" data-stat="songs">0</dd>
          </div>
          <div class="stat">
            <dt>艺术家</dt>
            <dd data-count="339" data-stat="artists">0</dd>
          </div>
          <div class="stat">
            <dt>专辑</dt>
            <dd data-count="402" data-stat="albums">0</dd>
          </div>
          <div class="stat">
            <dt>风格</dt>
            <dd data-count="8" data-stat="genres">0</dd>
          </div>
        </dl>
      </div>

      <div class="hero__art" aria-hidden="true">
        <div class="vinyl-glow"></div>
        <div class="vinyl">
          <div class="vinyl__grooves"></div>
          <div class="vinyl__shine"></div>
          <div class="vinyl__label">
            <span class="vinyl__label-top">XIAO LIN</span>
            <strong class="vinyl__label-count" id="vinyl-count">431</strong>
            <span class="vinyl__label-bottom">TRACKS · 33⅓</span>
          </div>
        </div>
        <div class="equalizer">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <p class="hero__art-note">SIDE A · NOW SPINNING</p>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="toolbar" aria-label="搜索与筛选">
      <div class="toolbar__top">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="搜索歌名 / 艺术家 / 专辑" autocomplete="off" spellcheck="false" aria-label="搜索歌名、艺术家或专辑">
          <button class="search__clear" id="search-clear" type="button" aria-label="清空搜索" hidden>×</button>
        </label>

        <div class="toolbar__controls">
          <label class="sort">
            <span>排序</span>
            <select id="sort" aria-label="排序方式">
              <option value="default">默认顺序</option>
              <option value="title">歌名</option>
              <option value="artist">艺术家</option>
              <option value="album">专辑</option>
              <option value="duration">时长</option>
            </select>
          </label>

          <div class="view-toggle" role="group" aria-label="切换视图">
            <button type="button" data-view="grid" aria-label="网格视图" aria-pressed="true">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            </button>
            <button type="button" data-view="list" aria-label="列表视图" aria-pressed="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="3.5" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="chips" id="genre-chips" role="group" aria-label="按风格筛选"></div>
      <p class="result-count" id="result-count" aria-live="polite"></p>
    </section>

    <section class="collection" aria-label="歌曲列表">
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" hidden>
        <span class="empty__icon">⌕</span>
        <h2>没有找到匹配的歌曲</h2>
        <p>换个关键词，或者点「全部」看看。</p>
        <button class="btn btn--ghost" id="empty-reset" type="button">重置筛选</button>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p class="footer__line">用 ♪ 收好的私人歌单 · <span id="year">2026</span></p>
    <p class="footer__sub">数据来自酷我音乐与 QQ 音乐 · 封面与分类仅作个人展示</p>
    <p class="footer__links">
      <a href="https://tuxlin123233.github.io/" target="_blank" rel="noopener">返回主页</a>
      <span>·</span>
      <a href="https://github.com/TuxLin123233" target="_blank" rel="noopener">GitHub</a>
      <span>·</span>
      <a href="https://music.163.com/" target="_blank" rel="noopener">网易云音乐</a>
    </p>
  </footer>

  <button class="to-top" id="to-top" type="button" aria-label="回到顶部">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg>
  </button>

  <dialog class="song-dialog" id="song-dialog" aria-labelledby="dialog-title">
    <div class="song-dialog__panel">
      <button class="song-dialog__close" id="dialog-close" type="button" aria-label="关闭">×</button>
      <div class="song-dialog__cover">
        <img id="dialog-cover" alt="" width="320" height="320">
      </div>
      <div class="song-dialog__info">
        <p class="song-dialog__eyebrow" id="dialog-index">TRACK 001</p>
        <h2 id="dialog-title"></h2>
        <p class="song-dialog__artist" id="dialog-artist"></p>
        <p class="song-dialog__album" id="dialog-album"></p>
        <div class="song-dialog__tags" id="dialog-tags"></div>
        <div class="song-dialog__actions">
          <a class="btn btn--primary" id="dialog-qq" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
            QQ 音乐
          </a>
          <a class="btn btn--ghost" id="dialog-netease" href="#" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/></svg>
            网易云音乐
          </a>
        </div>
        <p class="song-dialog__hint">在音乐平台继续收听</p>
      </div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
